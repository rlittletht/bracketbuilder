<html>
<head>
    <style>
        textarea.code
        {
            overflow-x: scroll;
            white-space: pre
        }
    </style>
    <script src="./parser.js" language="javascript"></script>
    <script src="./visualizers.js" language="javascript"></script>
    <script>
        function doPageInit()
        {
            var log = getUrlVars()["log"];
            var title = getUrlVars()["title"];
            var zoom = getUrlVars()["zoom"];

            setPageTitle("");
            setCanvasZoom(parseCanvasZoom(zoom));

            if (title)
                setPageTitle(decodeURIComponent(title));
            if (log)
            {
                document.getElementById("textGridData").value = decodeURIComponent(log);
                visualize();
            }
            return true;
        }
    </script>
</head>
<body onload="doPageInit()">
